name: Sync Live Scores

on:
  schedule:
    - cron: '*/5 * 11-30 6 *'
    - cron: '*/5 * 1-19 7 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger score sync
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://cpfc-mundial.vercel.app/api/sync-scores")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Sync returned non-200 status: $STATUS"
            exit 1
          fi
